<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0a0e17; overflow: hidden; position: relative; font-family: Helvetica, Arial, system-ui, sans-serif; }
  .glow { position: absolute; inset: 0; background: radial-gradient(75% 75% at 50% 2%, rgba(217,123,251,0.20), rgba(10,14,23,0) 58%); }
  .mark { position: absolute; left: 50%; top: 118px; transform: translateX(-50%); }
  .stack { position: absolute; left: 0; right: 0; top: 332px; text-align: center; }
  h1 { font-size: 68px; font-weight: 700; letter-spacing: -2.5px; color: #e8edf5; }
  h1 .c { color: #d97bfb; }
  h1 .io { color: #6b7a99; }
  .sub { font-size: 26px; font-weight: 400; color: #8a97b0; margin-top: 22px; }
  .tools { font-family: 'Courier New', monospace; font-weight: 700; font-size: 28px; letter-spacing: 1px; color: #5a6680; margin-top: 40px; }
  .tools b { color: #d97bfb; font-weight: 700; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="mark" width="144" height="144" viewBox="0 0 48 48" fill="none">
    <path d="M29 11 L15 24 L29 37" stroke="#d97bfb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="34.5" cy="24" r="3.4" fill="#ffffff"></circle>
  </svg>
  <div class="stack">
    <h1>LLM<span class="c">Cost</span></h1>
    <div class="sub">What will your LLM actually cost?</div>
    <div class="tools">openai<b>&nbsp;&nbsp;&lsaquo;&nbsp;&nbsp;</b>anthropic<b>&nbsp;&nbsp;&lsaquo;&nbsp;&nbsp;</b>gemini<b>&nbsp;&nbsp;&lsaquo;&nbsp;&nbsp;</b>deepseek</div>
  </div>
</body>
</html>
