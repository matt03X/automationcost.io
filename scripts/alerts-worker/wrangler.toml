# Cloudflare Worker config (deploy přes CLI: `wrangler deploy`).
# Deploy jde i bez CLI – přes web dashboard, viz README.md.
# SECRETS se NIKDY nepíšou sem – nastav je přes `wrangler secret put` nebo v
# dashboardu (Settings → Variables and Secrets). Tenhle soubor je veřejný.
name = "wizardcost-alerts"
main = "worker.js"
compatibility_date = "2026-06-01"

# KV pro týdenní digest (ping na iPhone). Vytvoř namespace a doplň jeho id:
#   wrangler kv namespace create DIGEST   →  vypíše id, vlož níž
# (nebo v dashboardu: Workers & Pages → KV → Create → pak Worker → Settings →
#  Variables → KV Namespace Bindings → Add: Variable name = DIGEST)
[[kv_namespaces]]
binding = "DIGEST"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
