# Týdenní marketing snapshot (GSC + Cloudflare Web Analytics).
# Stáhne SEO + traffic data a commitne JSON do větve `marketing-data`.
#
# PROČ samostatná větev: GitHub Pages servíruje root masteru → cokoli na masteru
# je veřejné. Tvoje keyword/traffic data privátní → jdou do `marketing-data`,
# kterou Pages NEservíruje. Verzovaná historie zůstává (trend v čase).
#
# Secrets (Settings → Secrets and variables → Actions):
#   GSC_SA_JSON           = celý obsah service-account JSON klíče
#   GSC_SITE_URL          = (volitelné) default 'sc-domain:wizardcost.com'
#   CLOUDFLARE_API_TOKEN  = token s Account Analytics:Read
#   CLOUDFLARE_ACCOUNT_ID = account tag
#   CLOUDFLARE_SITE_TAG   = (volitelné) Web Analytics site token
name: marketing-snapshot
on:
  schedule:
    - cron: "0 7 * * 1"      # každé pondělí 07:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalace závislostí
        run: pip install --quiet google-auth requests truststore
      - name: Stáhnout snapshot (jeden zdroj smí selhat, druhý projde)
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ secrets.CLOUDFLARE_SITE_TAG }}
        run: python scripts/marketing/snapshot.py --out /tmp/marketing
      - name: Commit do větve marketing-data (NEservírovaná Pages = privátní)
        run: |
          git config user.name  "marketing-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin marketing-data >/dev/null 2>&1; then
            git fetch origin marketing-data:marketing-data
            git worktree add /tmp/md marketing-data
          else
            git worktree add -b marketing-data /tmp/md
            ( cd /tmp/md && git rm -rf . >/dev/null 2>&1 || true )
          fi
          cp /tmp/marketing/*.json /tmp/md/
          cd /tmp/md
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot beze změny — nic k commitu."
          else
            git commit -m "marketing snapshot $(date -u +%F)"
            git push origin marketing-data
          fi
