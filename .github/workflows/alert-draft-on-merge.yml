# Po mergi cenového PR (= owner schválil změnu) vytvoří MailerLite DRAFT
# z NOVÝCH alert položek (alerts.xml se přegeneruje při buildu na PR větvi a
# merge ho dostane na master). Dedup bezstavově přes git (alerts.xml vs HEAD~1).
# NEODESÍLÁ — owner pošle send tlačítkem. Tím je tok: 📧 mail → 👀 merge → 📱 send.
name: alert-draft-on-merge
on:
  push:
    branches: [master]
    paths:
      - "automation/alerts.xml"
      - "llm/alerts.xml"
permissions:
  contents: read
concurrency:
  group: alert-draft-on-merge
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # potřebujeme HEAD~1 alerts.xml pro dedup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vytvořit MailerLite draft z nových alertů (NEodesílá)
        env:
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
        run: |
          if [ -z "$MAILERLITE_API_TOKEN" ]; then
            echo "::warning::MAILERLITE_API_TOKEN secret chybí — draft se nevytvoří. Přidej ho v repo Settings → Secrets → Actions."
            exit 0
          fi
          python scripts/draft-on-merge.py --site automation
