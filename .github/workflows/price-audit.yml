# Denní cenový AUDIT + ALARM (jediný monitor cen; price-watch zrušen 2026-06-14,
# protože sentinel string-match dával falešné poplachy na dynamických cenících).
# Aktivně scrapuje reálné ceny (slidery/toggly), uloží snapshot do
# automation/data/audit/<vendor>/<datum>.{json,html.gz}, zdiffuje proti
# předchozímu dni → changes-<datum>.json + price-history.jsonl (grafy).
# Mail ownerovi (job fail) přijde JEN při REÁLNÉ změně ceny (changeCount > 0)
# nebo tvrdé chybě scrape — ne při bot-wallu (ten je tolerován jako WARN).
name: price-audit
on:
  schedule:
    - cron: "30 6 * * *"   # denně 06:30 UTC
  workflow_dispatch:
permissions:
  contents: write          # commit snapshotů zpět do repa
  pull-requests: write     # auto-PR s návrhem cenové aktualizace
concurrency:
  group: price-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (mimo repo checkout)
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y > /dev/null
          npm install playwright@1 > /dev/null
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Spustit cenový audit (exit 1 jen při tvrdé chybě; bot-wall = WARN)
        run: NODE_PATH=/tmp/pw/node_modules node scripts/price-audit.js
      - name: Commit snapshotů a změn (vždy — ať se důkazy uloží i při změně)
        if: always()
        run: |
          git config user.name  "price-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/data/audit
          if git diff --cached --quiet; then
            echo "Žádné nové audit soubory — nic k commitu."
          else
            DATE=$(date -u +%Y-%m-%d)
            CHANGES=$(D="$DATE" node -e "try{console.log(require('./automation/data/audit/changes-'+process.env.D+'.json').changeCount)}catch{console.log(0)}")
            git commit -m "audit: cenové snapshoty ${DATE} (${CHANGES} změn)"
            git push
          fi
      - name: Auto-návrh cenového PATCHe → Pull Request ke schválení (1-tap merge)
        if: always()
        continue-on-error: true   # bonus navíc — NIKDY nesmí shodit audit/alarm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "price-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          BR="auto/price-update-${DATE}"
          git checkout -B "$BR"
          # patcher zapíše do tools.json JEN jisté změny (cena==old self-check) + popis PR
          node scripts/propose-price-updates.js --write --summary /tmp/pr-body.md || true
          if git diff --quiet automation/data/tools.json; then
            echo "Žádná auto-aplikovatelná cenová změna — PR se netvoří."
            exit 0
          fi
          git add automation/data/tools.json
          git commit -m "auto: cenová data ${DATE} (návrh z auditu)"
          # přegeneruj výstupy z tools.json (kalkulačka, compare, changelog, feedy, homepage demo)
          python automation/build.py || true
          python build.py || true
          git add -A
          git commit -m "auto: rebuild po cenové aktualizaci ${DATE}" || true
          git push -u origin "$BR" --force
          gh pr create --base master --head "$BR" \
            --title "Cenová aktualizace ${DATE} (auto-návrh — zkontroluj a merge)" \
            --body-file /tmp/pr-body.md \
            || gh pr edit "$BR" --body-file /tmp/pr-body.md || true
      - name: ALARM — fail (= mail ownerovi) jen při REÁLNÉ změně (cena NEBO billing)
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%d)
          F="automation/data/audit/changes-${DATE}.json"
          CHANGES=$(node -e "try{console.log(require('./'+process.argv[1]).changeCount)}catch{console.log(0)}" "$F" 2>/dev/null || echo 0)
          PRICE=$(node -e "try{console.log(require('./'+process.argv[1]).priceChanges)}catch{console.log(0)}" "$F" 2>/dev/null || echo 0)
          BILL=$(node -e "try{console.log(require('./'+process.argv[1]).billingChanges)}catch{console.log(0)}" "$F" 2>/dev/null || echo 0)
          echo "Detekováno změn: ${CHANGES} (${PRICE} cenových, ${BILL} billing)"
          if [ "$CHANGES" -gt 0 ]; then
            echo "## ⚠ Změna v účtování detekována — ${PRICE} cenových, ${BILL} billing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Co přesně se mění:**" >> "$GITHUB_STEP_SUMMARY"
            node -e "try{require('./'+process.argv[1]).changes.forEach(c=>console.log('- '+(c.desc||JSON.stringify(c))))}catch{}" "$F" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Další krok: node calc-test/verify-pricing-live.js <slug> → ověřit → revize tools.json." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Ceny i billing beze změny — žádný alarm."
