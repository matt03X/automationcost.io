# Denní hlídač cen: sentinel check oficiálních ceníků proti tools.json.
# Fail = GitHub pošle ownerovi notifikační mail → ověřit a opravit data
# (workflow v CLAUDE.md; sentinely v scripts/price-watch.js).
name: price-watch
on:
  schedule:
    - cron: "0 6 * * *"   # denně 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (mimo repo checkout)
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y > /dev/null
          npm install playwright@1 > /dev/null
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Sentinel check ceníků
        run: NODE_PATH=/tmp/pw/node_modules node scripts/price-watch.js
