# JEDNORÁZOVÝ TEST e-mailového řetězce alarmu.
# Spustí se PUSHEM, který se dotkne souboru .audit-test-trigger (tak to odpálím
# přesně v 17:00 tvého času bez gh CLI). Job NIC necommituje a NEsahá na
# automation/data → reálná audit data jsou v bezpečí. exit 1 → GitHub pošle
# "workflow failed" mail ownerovi = ověření, že notifikace chodí.
# Po ověření se tenhle soubor (+ skript + trigger) smažou.
name: audit-email-test
on:
  workflow_dispatch:
  push:
    paths:
      - ".audit-test-trigger"
permissions:
  contents: read
jobs:
  email-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vyvolat TEST alarm (exit 1 = mail ownerovi; data se nedotýká)
        run: node scripts/audit-email-test.js
