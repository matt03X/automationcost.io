# DOČASNÝ — plný test řetězce auto-PR. Spustí se pushem na .pr-demo-trigger.
# Dělá přesně to, co PR-krok v price-audit.yml (patch → build → gh pr create),
# jen bez scrapu (rychlé) a s pevně daným injektovaným changes souborem.
# Po testu SMAZAT (workflow + trigger).
name: pr-demo
on:
  push:
    paths:
      - ".pr-demo-trigger"
permissions:
  contents: write
  pull-requests: write
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch + build + otevřít PR (plný test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "price-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          BR="auto/price-update-${DATE}"
          git checkout -B "$BR"
          node scripts/propose-price-updates.js --write \
            --changes automation/data/audit/changes-2026-06-15.json \
            --summary /tmp/pr-body.md
          if git diff --quiet automation/data/tools.json; then
            echo "Žádná auto-aplikovatelná změna — nic."
            exit 0
          fi
          git add automation/data/tools.json
          git commit -m "auto: cenová data ${DATE} (plný test)"
          python automation/build.py || true
          python build.py || true
          git add -A
          git commit -m "auto: rebuild po cenové aktualizaci ${DATE}" || true
          git push -u origin "$BR" --force
          gh pr create --base master --head "$BR" \
            --title "[TEST] Cenová aktualizace ${DATE} (plný test — zkontroluj a merge)" \
            --body-file /tmp/pr-body.md \
            || gh pr edit "$BR" --body-file /tmp/pr-body.md || true
